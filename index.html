<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>风之谷</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>风之谷</h1>
      <p class="subtitle">元素循环之旅：风、水、冰的自然共鸣。</p>
    </header>

    <div id="hud">
      <span id="form">形态: 风</span>
      <span id="area">区域: 空灵原野</span>
      <span id="hint">提示: 进入特定区域触发变换。</span>
    </div>

    <div class="canvas-wrap">
      <canvas id="game-canvas" width="960" height="540"></canvas>
      <div id="message" class="message"></div>
    </div>

    <div id="instructions" class="instructions">
      WASD / 方向键 移动，空格 加速，E 触发形态，R 重置。
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
